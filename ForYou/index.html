    body {

  font-family: 'Pacifico', cursive;

h3 {
  font-size: 2.5rem; /* use rem instead of em for better scaling */

  flex-wrap: wrap; /* allow wrapping on small screens */
  justify-content: center;
  max-width: 90vw; /* limit width on small devices */

}

h3 span {
  opacity: 0;
  transform: translateY(-30px);
  display: inline-block;
  animation: bounceIn 0.6s forwards;
  animation-fill-mode: forwards;
}

@keyframes bounceIn {
  0% {
    opacity: 0;
    transform: translateY(-30px);
  }
  60% {
    opacity: 1;
    transform: translateY(10px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Media Queries */
@media (max-width: 500px) {
  h3 {
    font-size: 2rem;
  }
}

@media (max-width: 300px) {
  h3 {
    font-size: 1.5rem;
  }
  body {
    height: auto; /* allow page to grow vertically on small screens */
    padding: 1rem;

}

</style>

<audio id="audios" preload="auto" autoplay loop>
  <source src="MP3/1.mp3" type="audio/mpeg" />
  Your browser does not support the audio element.
</audio>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const audio = document.getElementById("audios");
    audio.volume = 1;  // Max volume

    const tryPlay = () => {
      audio.play().catch(() => {
        console.log("Autoplay blocked. Waiting for user interaction...");

        const resumeAudio = () => {
          audio.play().then(() => {
            console.log("Audio started after user interaction.");
          }).catch(err => {
            console.warn("Still blocked:", err);
          });
          document.removeEventListener("click", resumeAudio);
        };

        document.addEventListener("click", resumeAudio);
      });
    };

    tryPlay();
  });
</script>

<script>
  const heart = `<span style="color:#ff00bf;">${String.fromCodePoint(0x2764)}</span>`;
  const text = `For Akayie ${heart}`;
  const container = document.getElementById("animatedText");

  const temp = document.createElement("div");
  temp.innerHTML = text;

  [...temp.childNodes].forEach((node, i) => {
    if (node.nodeType === Node.TEXT_NODE) {
      node.textContent.split('').forEach((char, index) => {
        const span = document.createElement("span");
        span.textContent = char;
        span.style.display = "inline-block";
        span.style.animation = "fadeIn 0.5s ease forwards";
        span.style.animationDelay = `${(i + index) * 0.1}s`;
        container.appendChild(span);
      });
    } else {
      node.style.display = "inline-block";
      node.style.animation = "fadeIn 0.5s ease forwards";
      node.style.animationDelay = `${i * 0.1}s`;
      container.appendChild(node);
    }
  });

  const style = document.createElement("style");
  style.textContent = `
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  `;
  document.head.appendChild(style);
</script>
