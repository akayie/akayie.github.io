    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Arguments Example 2</title>
    <script type="text/javascript">
        function setName(obj){
            obj.name="Nicholas";
        }
        var person = new Object();
        setName(person);
        alert(person.name);

</script>
