<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execution Context Example 1</title>
    <script type="text/javascript">
        var color = "blue";
        function ChangeColor() {
            if (color = "blue") {
                color = "red";
            } else {
                color = "blue";
            }
        }
        ChangeColor();
        alert("Color is now " + color);

    </script>
</head>

<body>

</body>

</html>
