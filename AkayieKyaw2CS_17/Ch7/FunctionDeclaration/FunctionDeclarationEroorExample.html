<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Declaration Error Example</title>
</head>
<body>
    <script type="text/javascript">
        var condition = true;
        if(condition){
            function sayHi(){
                alert("Hi!");
            };
        }
            else{
                function sayHi(){
                    alert ("Yo!");
                }
            }
        
      
    </script>
</body>
</html>
