<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Example 1</title>
</head>
<body>
    <script type="text/javascript">
     var name = "The Window ";
     var object = {
        name: "My Object", //comma 
        getNamefunc : function(){
            return function(){
            return this.name;
        };
     }};
     alert (object.getNamefunc() ());
    </script>
</body>
