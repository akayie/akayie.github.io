<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Example</title>
    <script language="javascript">
        function check_it(){
            var tomatch=/[A-Za-z0-9]\w{2,}@[A-Za-z0-9]\.[A-Za-z]{3}/;
            var emadd=document.f1.t1.value;
            if(tomatch.test(emadd)){
                alert("E-mail address OK");
                return true;}
                else{
                    alert("E-mail address invalid. Please Try again");
                    return false;
                }
            }
        
    </script>
</head>
<body>
     <form name="f1" id="f1" action="page1.html" onsubmit="return check_it()">
        Enter your email address: <br> <input type="text" name="t1" id="t1"><br>
        <input type="submit">
     </form>
</body>
</html>
