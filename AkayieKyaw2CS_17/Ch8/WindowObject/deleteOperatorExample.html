<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Delete Operator Example</title>
</head>
<body>
    <p> Hello World!</p>
     <script type="text/javascript">
        var age=29;
        window.color = "red";
        delete window.age; //variables declared with var cannot be deleted
        delete window.color; //global window object—this can be deleted
        alert(window.age); //29
        alert(window.color);// undefined
    </script> 
</body>   
</html>
