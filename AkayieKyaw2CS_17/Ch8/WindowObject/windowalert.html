<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Window Alert </title>
</head>
<body>
     <script type="text/javascript">
       alert("My name is Tayza");
       window.alert("Welcome to programming knoeledge.blogspot.com");
       window.close();
    </script> 
</body>   
</html>
<!-- First alert: "My name is Tayza" appears.

Second alert: "Welcome to programming knoeledge.blogspot.com" pops up.

The window stays open—window.close() is silently ignored by the browser. -->
