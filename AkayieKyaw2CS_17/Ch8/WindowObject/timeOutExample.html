<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Out Example</title>
</head>
<body>
     <script type="text/javascript">
      setTimeout(function () {
        alert ("Hello World!"); // တစ်ကြိမ် အလုပ်လုပ်ပေး pops up once after 1 second,
      }, 1000);
    </script> 
</body>   
</html>
