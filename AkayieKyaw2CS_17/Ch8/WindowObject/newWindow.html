<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>open a new Window</title>
</head>
<body>
    <p> This will open a new window/tab:
        <input type="button" value="Go to Wrox.com" onclick="window.open('http://www.wrox.com')" />
    </p>
    <!-- new window -->
    <p> This will open in the current window/tab:
        <input type="button" value="Go to Wrox.com" onclick="location.href='http://www.wrox.com'" />
    </p> 
    <!-- this window -->
</body>
</body>
</html>
