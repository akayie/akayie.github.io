<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Out Example 2</title>
</head>
<body>
     <script type="text/javascript">
      var timeoutId = setTimeout(function () {
        alert ("Hello World!"); //pops up once after 1 second,
      }, 1000);
      clearTimeout(timeoutId)  //if you want to cancel the alert before it pops:
    </script> 
</body>   
</html>
