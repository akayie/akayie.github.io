<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window Confirm</title>
</head>
<body>
     <script type="text/javascript">
        var x = window.confirm("Are you sure you are ok?") //OK Cancel alert box
        if(x){
            window.alert("Thank you so much for reading my Confirm lesson.1") //OK
        }else{
            window.alert("See you next time, welcome to my website."); //Cancel
        }
    </script> 
</body>
</html>
