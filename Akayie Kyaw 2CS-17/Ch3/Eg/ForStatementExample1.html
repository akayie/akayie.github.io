<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Statement Example1</title>
    <script type="text/javascript">
        var count=10;
        for (var i=0; i<count;i++){
            alert (i);
        }
        var count =10;
        var i=0;
        while (i<count){
            alert(i);
            i++;
        }
</script>
</head>

</body>
</html>
