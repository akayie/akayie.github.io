<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Statement Example 1</title>
    <script type="text/javascript">
        var i=30;
        switch (i){
            case 25:
                alert("25");
                break;
            case 35:
                alert("35");
                break;
            case 45:
                alert("45");
                break;
            default:
                alert("Other");
        }
    </script>
</head>
<body>
    
</body>
</html>
