<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boolean type Example </title>
    <script type="text/javascript">
        var falseObject = new Boolean(true);
        alert (falseObject);
        var result = falseObject && true;
        alert (result);

         var falseValue = false;
        alert (falseValue);
        var result = falseValue && true;
        alert (result);
        
        alert (typeof falseObject);
        alert (typeof falseValue);
        alert (falseObject);
        alert (falseValue);
        


    </script>
</head>
<body>
    
</body>
</html>
