<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closure Example 1</title>
</head>
<body>
    <script type="text/javascript">
        function createfunction(){
            var result = new Array();
            for(var i = 0 ; i < 10; i++){
                result [i] = function(){
                    return i;
                };
            }
            return result;
        }
    </script>
</body>
</html>
