<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Example 3</title>
</head>
<body>
    <script type="text/javascript">
     var name = "The Window ";
     var object = {
        name: "My Object", //comma 
        getName : function(){
            return this.name;
     }};
    alert (object.getName());
    alert (object.getName());
    alert (object.getName = object.getName());

    </script>
</body>
