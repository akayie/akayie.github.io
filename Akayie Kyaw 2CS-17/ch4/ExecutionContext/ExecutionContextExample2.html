    <script type="text/javascript">
        var color = "blue";
        function ChangeColor() {
            var anotherColor="red";
            function swapColors(){
                var tempColor = anotherColor;
                anotherColor = color;
                color =tempColor;
            }
            swapColors();
        }
        alert (color);
    </script>
