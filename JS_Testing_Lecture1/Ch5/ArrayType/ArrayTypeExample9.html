<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Type Example 9</title>
    <script type="text/javascript">
        var colors = new Array();
        var count = colors.push("red","green");
        alert (count);
        count = colors.push("black");
        alert(count);
        var item=colors.pop();
        alert(item);
        alert(colors.length);
    </script>
</head>
