    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegExp Constructor Properties Example 2</title>
    <script type="text/javascript">
        var text = "this has been a short summer";
        var pattern = /(.)hort/g;
        if (pattern.test(text)){
            alert(RegExp.$_);
            alert (RegExp["$`"]);
            alert(RegExp ["$'"]);
            alert(RegExp ["$&"]);
            alert(RegExp ["$+"]);
            alert(RegExp ["$*"]);
        }


    </script>
</head>
